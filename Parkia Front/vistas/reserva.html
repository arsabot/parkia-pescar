<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parkia - Reserva</title>
  <link rel="stylesheet" href="../css/vistas.css" />
</head>
<body>

<div class="app">
  <header class="header">
    <span class="logo">Parkia</span>
    <nav class="nav">
      <a href="../index.html">Inicio</a>
      <a href="detalle.html">Buscar</a>
      <a href="reserva.html" class="active">Reservas</a>
      <a href="historial.html">Historial</a>
      <a href="#">Ayuda</a>
    </nav>
    <a href="perfil.html" class="avatar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </a>
  </header>

  <div class="container">

    <div class="section-title">Reserva</div>

    <div class="reserve-card">
      <div class="reserve-header">
        <div class="reserve-parking-info">
          <h3>Parking Corrientes</h3>
          <p>Av. Corrientes 1234, CABA</p>
        </div>
        <div class="reserve-price">$2.500 <span>/ hora</span></div>
      </div>

      <div class="reserve-body">
        <h3>Seleccioná fecha y horario</h3>

        <div class="form-group">
          <label>Fecha</label>
          <input type="date" value="2026-09-09" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Hora de entrada</label>
            <input type="time" value="10:00" />
          </div>
          <div class="form-group">
            <label>Hora de salida</label>
            <input type="time" value="14:00" />
          </div>
        </div>

        <div class="form-group">
          <label>Duración estimada</label>
          <div class="duration-box">4 horas</div>
        </div>

        <div class="reserve-summary">
          <div class="summary-row">
            <span>Precio por hora</span>
            <span>$2.500</span>
          </div>
          <div class="summary-row total">
            <span>Total estimado</span>
            <strong>$10.000</strong>
          </div>
        </div>

        <a href="confirmacion.html" class="btn-primary" style="display:flex;align-items:center;justify-content:center;text-decoration:none;gap:8px;">
          Continuar <i data-lucide="arrow-right" style="width:16px;height:16px;"></i>
        </a>
      </div>
    </div>

  </div>

  <!-- Bottom Nav Mobile -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <a href="../index.html"><i data-lucide="house" class="nav-icon"></i> Inicio</a>
      <a href="detalle.html" class="active"><i data-lucide="search" class="nav-icon"></i> Reservas</a>
      <a href="historial.html"><i data-lucide="clipboard-list" class="nav-icon"></i> Historial</a>
      <a href="perfil.html"><i data-lucide="user" class="nav-icon"></i> Perfil</a>
    </div>
  </nav>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
