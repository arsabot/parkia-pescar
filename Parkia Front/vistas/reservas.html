<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parkia - Mis Reservas</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/vistas.css" />
  <link rel="stylesheet" href="../css/chatbot.css" />
  <script src="../js/config.js"></script>
</head>
<body>

<div class="app">
  <header class="header">
    <a href="../index.html" class="logo" style="text-decoration:none;">Parkia</a>
    <nav class="nav">
      <a href="../index.html">Inicio</a>
      <a href="buscador.html">Buscar</a>
      <a href="reservas.html" class="active">Mis Reservas</a>
      <a href="dashboard_negocio.html" class="nav-badge-b2b"><span>★</span> Panel Cocheras</a>
      <a href="javascript:void(0)" onclick="if(window.parkiabotTriggerFaq) window.parkiabotTriggerFaq('cancelar')">Ayuda</a>
    </nav>
    <a href="perfil.html" class="avatar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </a>
  </header>

  <div class="container">

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <div class="section-title" style="margin:0;">Mis reservas activas</div>
      <a href="buscador.html" class="btn-primary" style="padding:8px 16px;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;">
        <i data-lucide="plus" style="width:14px;height:14px;"></i> Nueva reserva
      </a>
    </div>

    <div id="reservasContainer">
      <div style="text-align:center;padding:40px 20px;color:#64748B;">
        <p>Cargando tus reservas en tiempo real...</p>
      </div>
    </div>

  </div>

  <!-- Bottom Nav Mobile -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <a href="../index.html"><i data-lucide="house" class="nav-icon"></i> Inicio</a>
      <a href="buscador.html"><i data-lucide="search" class="nav-icon"></i> Buscar</a>
      <a href="reservas.html" class="active"><i data-lucide="calendar" class="nav-icon"></i> Reservas</a>
      <a href="dashboard_negocio.html"><i data-lucide="bar-chart-2" class="nav-icon"></i> Cocheras</a>
      <a href="perfil.html"><i data-lucide="user" class="nav-icon"></i> Perfil</a>
    </div>
  </nav>
</div>

<!-- Modal QR de Acceso -->
<div class="mp-modal-backdrop hidden" id="qrModal">
  <div class="mp-modal-card" style="width:360px;">
    <div class="mp-modal-header" style="background:#0B192C;">
      <div class="mp-modal-brand">
        <h3>Pase de Acceso Parkia</h3>
      </div>
      <button type="button" class="mp-modal-close" onclick="cerrarQrModal()">✕</button>
    </div>
    <div class="mp-modal-body">
      <h4 id="qrModalTitle" style="margin:0 0 6px;">Garage</h4>
      <p id="qrModalSubtitle" style="font-size:12px;color:#64748B;margin:0 0 16px;">Horario</p>
      <div class="mp-qr-box" style="width:200px;height:200px;">
        <img id="qrModalImg" src="" alt="QR" />
      </div>
      <p style="font-size:15px;font-weight:800;color:#0B192C;margin:0;" id="qrModalCode">#PK-00000</p>
      <p style="font-size:11px;color:#94A3B8;margin-top:4px;">Presentá este código frente al lector de la barrera</p>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../js/chatbot.js"></script>
<script>
  if (window.lucide) { lucide.createIcons(); }

  function cargarMisReservas() {
    var container = document.getElementById('reservasContainer');

    fetch(window.getParkiaApiUrl('reservas/'))
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        var items = data.results || [];
        if (items.length === 0) {
          renderFallbackReservas();
          return;
        }

        container.innerHTML = '';
        items.forEach(function (res) {
          var itemEl = document.createElement('div');
          itemEl.className = 'list-item';

          var fechaStr = '';
          if (res.fecha_inicio) {
            var d1 = new Date(res.fecha_inicio);
            var d2 = new Date(res.fecha_fin);
            fechaStr = d1.toLocaleDateString('es-AR') + ' · ' +
              d1.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }) + ' - ' +
              d2.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }) + ' hs';
          }

          var statusClass = res.estado === 'CONFIRMADA' ? 'active' : (res.estado === 'PENDIENTE' ? 'active' : 'completed');
          var mpBadge = (res.pago_proveedor === 'mercado_pago' || res.pago_estado === 'APROBADO') 
            ? '<span class="parkiabot-badge-mp" style="margin-left:6px;">Mercado Pago</span>' 
            : '';

          itemEl.innerHTML = `
            <div class="list-item-left">
              <div class="list-thumb" style="background:#0B192C;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;border-radius:10px;">🚗</div>
              <div>
                <h4 style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;">
                  ${res.estacionamiento_nombre || 'Estacionamiento Parkia'}
                  ${mpBadge}
                </h4>
                <div class="list-rating" style="color:#0284C7;font-weight:600;">Cochera ${res.espacio_numero || 'A-01'}</div>
                <p class="list-meta">${fechaStr}</p>
                <div style="margin-top:8px;display:flex;gap:8px;">
                  <button type="button" onclick="mostrarQr('${res.id}', '${res.estacionamiento_nombre || 'Parkia'}', '${fechaStr}')" style="background:#0B192C;color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;">
                    Ver QR
                  </button>
                  ${res.estado !== 'CANCELADA' ? `
                    <button type="button" onclick="cancelarReserva(${res.id})" style="background:#FEE2E2;color:#DC2626;border:1px solid #FECACA;border-radius:8px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;">
                      Cancelar
                    </button>
                  ` : ''}
                </div>
              </div>
            </div>
            <div class="list-item-right" style="text-align:right;">
              <span class="badge-status ${statusClass}">${res.estado_display || res.estado}</span>
              <p class="list-price" style="margin-top:8px;">$${Number(res.precio_total).toLocaleString('es-AR')}</p>
            </div>
          `;
          container.appendChild(itemEl);
        });

        if (window.lucide) { lucide.createIcons(); }
      })
      .catch(function (err) {
        console.warn('Fallback reservas demo:', err);
        renderFallbackReservas();
      });
  }

  function renderFallbackReservas() {
    var container = document.getElementById('reservasContainer');
    container.innerHTML = `
      <div class="list-item">
        <div class="list-item-left">
          <div class="list-thumb" style="background:#0B192C;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;border-radius:10px;">🚗</div>
          <div>
            <h4 style="display:flex;align-items:center;gap:6px;">
              Estacionamiento Central Obelisco
              <span class="parkiabot-badge-mp">Mercado Pago</span>
            </h4>
            <div class="list-rating" style="color:#0284C7;font-weight:600;">Cochera A-01 · Acceso QR</div>
            <p class="list-meta">Hoy · 10:00 - 14:00 hs</p>
            <div style="margin-top:8px;">
              <button type="button" onclick="mostrarQr('101', 'Estacionamiento Central Obelisco', 'Hoy 10:00 - 14:00 hs')" style="background:#0B192C;color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;">
                Ver QR
              </button>
            </div>
          </div>
        </div>
        <div class="list-item-right">
          <span class="badge-status active">Confirmada</span>
          <p class="list-price">$10.000</p>
        </div>
      </div>

      <div class="list-item">
        <div class="list-item-left">
          <div class="list-thumb" style="background:#0B192C;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;border-radius:10px;">🚗</div>
          <div>
            <h4>Cocheras Palermo Soho</h4>
            <div class="list-rating" style="color:#64748B;">Cochera B-04</div>
            <p class="list-meta">25/10/2026 · 09:00 - 12:00 hs</p>
          </div>
        </div>
        <div class="list-item-right">
          <span class="badge-status completed">Completada</span>
          <p class="list-price">$7.500</p>
        </div>
      </div>
    `;
    if (window.lucide) { lucide.createIcons(); }
  }

  function mostrarQr(id, title, sub) {
    document.getElementById('qrModalTitle').textContent = title;
    document.getElementById('qrModalSubtitle').textContent = sub;
    document.getElementById('qrModalCode').textContent = '#PK-' + String(id).padStart(5, '0');
    document.getElementById('qrModalImg').src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=PARKIA-RES-' + id;
    document.getElementById('qrModal').classList.remove('hidden');
  }

  function cerrarQrModal() {
    document.getElementById('qrModal').classList.add('hidden');
  }

  function cancelarReserva(id) {
    if (!confirm('¿Estás seguro de que querés cancelar esta reserva? El lugar se liberará y se procesará el reembolso de Mercado Pago.')) return;

    fetch(window.getParkiaApiUrl('reservas/' + id + '/cancelar/'), { method: 'POST' })
      .then(function (r) {
        if (!r.ok) throw new Error('Error al cancelar');
        alert('Reserva cancelada con éxito.');
        cargarMisReservas();
      })
      .catch(function () {
        alert('Reserva cancelada (Modo demo local).');
        cargarMisReservas();
      });
  }

  cargarMisReservas();
</script>
</body>
</html>
